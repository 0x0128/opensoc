# OpenSOC TLS reverse proxy. One listener per web UI; certificates are signed by the
# OpenSOC root CA (infra/generated/certs/root-ca.pem). Upstreams are resolved lazily
# through Docker's DNS so the proxy starts even if a backend is still down.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  sendfile on;
  server_tokens off;
  client_max_body_size 1g;
  proxy_read_timeout 300s;
  proxy_send_timeout 300s;
  proxy_buffering off;
  proxy_request_buffering off;

  resolver 127.0.0.11 valid=30s ipv6=off;

  ssl_certificate /etc/nginx/certs/opensoc.pem;
  ssl_certificate_key /etc/nginx/certs/opensoc-key.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:10m;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # Common proxy headers (nginx does not inherit proxy_set_header into locations that define their own).
  proxy_http_version 1.1;
  proxy_set_header Host $http_host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;

  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Content-Type-Options nosniff always;

  # TheHive
  server {
    listen 9000 ssl;
    http2 on;
    location / {
      set $upstream http://thehive:9000;
      proxy_pass $upstream;
    }
  }

  # Cortex
  server {
    listen 9001 ssl;
    http2 on;
    location / {
      set $upstream http://cortex:9001;
      proxy_pass $upstream;
    }
  }

  # MISP
  server {
    listen 8443 ssl;
    http2 on;
    location / {
      set $upstream http://misp:80;
      proxy_pass $upstream;
    }
  }

  # Shuffle (the frontend proxies /api to shuffle-backend)
  server {
    listen 3443 ssl;
    http2 on;
    location / {
      set $upstream http://shuffle-frontend:80;
      proxy_pass $upstream;
    }
  }

  # Grafana
  server {
    listen 3000 ssl;
    http2 on;
    location / {
      set $upstream http://grafana:3000;
      proxy_pass $upstream;
    }
  }

  # Container healthcheck (loopback only)
  server {
    listen 127.0.0.1:8081;
    location = /healthz {
      access_log off;
      return 200 "ok\n";
    }
  }
}
