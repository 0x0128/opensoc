# OpenSOC - Cortex configuration, included by the generated config of the image
# entrypoint (which already sets search.uri, job.directory and analyzer catalogs).
# ${?VAR} values are read from the container environment.

play.http.secret.key = ${?CORTEX_SECRET}

search {
  index = cortex
  user = "elastic"
  password = ${?ELASTIC_PASSWORD}
  # Single Elasticsearch node.
  nbshards = 1
  nbreplicas = 0
}

# Session cookies are served through the OpenSOC TLS proxy.
play.http.session.secure = true
play.filters.csrf.cookie.secure = true
play.http.forwarded.trustedProxies = ["0.0.0.0/0", "::/0"]
play.http.parser.maxMemoryBuffer = 1M
play.http.parser.maxDiskBuffer = 1G

auth {
  provider = [local]
}

# Analyzers and responders run as sibling Docker containers (host socket).
job.runners = [docker]
cache.job = 10 minutes
