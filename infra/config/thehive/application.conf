# OpenSOC - extra TheHive settings. The image entrypoint generates the base
# configuration from the TH_* environment variables and includes this file last.

# Single Elasticsearch node: no replicas, so the cluster stays green.
db.janusgraph.index.search.elasticsearch.create.ext.number_of_replicas = 0
db.janusgraph.index.search.elasticsearch.create.ext.number_of_shards = 1

# Behind the OpenSOC TLS reverse proxy.
play.http.forwarded.trustedProxies = ["0.0.0.0/0", "::/0"]
play.http.parser.maxDiskBuffer = 1GB
play.http.parser.maxMemoryBuffer = 1MB
