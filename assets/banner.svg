<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="title desc">
  <title id="title">OpenSOC</title>
  <desc id="desc">Open-source Security Operations Center deployed with a single command on a single Linux host: Wazuh, Suricata, TheHive, Cortex, MISP, Shuffle and Grafana, already integrated.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070d1a"/>
      <stop offset="0.55" stop-color="#0c1730"/>
      <stop offset="1" stop-color="#0a2333"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0.08"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0.35"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1e3a5f" stroke-width="1" stroke-opacity="0.35"/>
    </pattern>
    <clipPath id="frame">
      <rect width="1280" height="320" rx="18"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1280" height="320" fill="url(#bg)"/>
    <rect width="1280" height="320" fill="url(#grid)"/>

    <!-- radar: the integrated SOC components orbiting the detection core -->
    <g transform="translate(1088 160)">
      <circle r="190" fill="url(#glow)"/>
      <g fill="none" stroke="#22d3ee" stroke-opacity="0.22">
        <circle r="48"/>
        <circle r="92"/>
        <circle r="136" stroke-dasharray="4 6"/>
      </g>
      <path d="M0 0L136 0A136 136 0 0 0 96.2 -96.2Z" fill="url(#sweep)"/>
      <g stroke="#34d399" stroke-opacity="0.35" stroke-width="1.2">
        <line x1="0" y1="0" x2="92" y2="0"/>
        <line x1="0" y1="0" x2="-46" y2="-79.7"/>
        <line x1="0" y1="0" x2="-46" y2="79.7"/>
        <line x1="0" y1="0" x2="96.2" y2="-96.2"/>
        <line x1="0" y1="0" x2="-136" y2="0"/>
        <line x1="0" y1="0" x2="35.2" y2="131.4"/>
      </g>
      <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#9fb3c8">
        <circle cx="92" cy="0" r="6" fill="#34d399"/>
        <text x="104" y="4">Suricata</text>
        <circle cx="-46" cy="-79.7" r="6" fill="#34d399"/>
        <text x="-58" y="-90" text-anchor="end">MISP</text>
        <circle cx="-46" cy="79.7" r="6" fill="#34d399"/>
        <text x="-58" y="96" text-anchor="end">Cortex</text>
        <circle cx="96.2" cy="-96.2" r="5" fill="#22d3ee"/>
        <text x="108" y="-100">TheHive</text>
        <circle cx="-136" cy="0" r="5" fill="#22d3ee"/>
        <text x="-148" y="4" text-anchor="end">Shuffle</text>
        <circle cx="35.2" cy="131.4" r="5" fill="#22d3ee"/>
        <text x="48" y="136">Grafana</text>
        <circle r="20" fill="#0c1730" stroke="url(#accent)" stroke-width="3"/>
        <circle r="6" fill="#22d3ee"/>
        <text x="0" y="40" text-anchor="middle" fill="#e2e8f0">Wazuh</text>
      </g>
    </g>

    <!-- logo mark: shield with a detection pulse -->
    <g transform="translate(72 74)">
      <path d="M44 0L88 16V50C88 80 69 100 44 112C19 100 0 80 0 50V16Z" fill="url(#shield)" stroke="url(#accent)" stroke-width="4" stroke-linejoin="round"/>
      <polyline points="12,60 30,60 38,42 50,80 58,52 64,60 76,60" fill="none" stroke="#e2e8f0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- wordmark -->
    <text x="186" y="142" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="76" font-weight="700" letter-spacing="-1" fill="#f8fafc">Open<tspan fill="url(#accent)">SOC</tspan></text>
    <text x="190" y="180" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="24" fill="#cbd5e1">Open-source Security Operations Center in one command</text>
    <text x="190" y="212" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="16" fill="#7dd3fc">$ sudo ./install.sh<tspan dx="18" fill="#64748b"># one Linux host · 16 GB RAM · Docker Compose</tspan></text>

    <!-- capability chips -->
    <g font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14" font-weight="600" fill="#d1fae5">
      <g transform="translate(72 248)">
        <rect width="96" height="30" rx="15" fill="#34d399" fill-opacity="0.12" stroke="#34d399" stroke-opacity="0.55"/>
        <text x="48" y="20" text-anchor="middle">SIEM / XDR</text>
      </g>
      <g transform="translate(178 248)">
        <rect width="108" height="30" rx="15" fill="#34d399" fill-opacity="0.12" stroke="#34d399" stroke-opacity="0.55"/>
        <text x="54" y="20" text-anchor="middle">Network IDS</text>
      </g>
      <g transform="translate(296 248)">
        <rect width="112" height="30" rx="15" fill="#34d399" fill-opacity="0.12" stroke="#34d399" stroke-opacity="0.55"/>
        <text x="56" y="20" text-anchor="middle">Threat intel</text>
      </g>
      <g transform="translate(418 248)">
        <rect width="80" height="30" rx="15" fill="#34d399" fill-opacity="0.12" stroke="#34d399" stroke-opacity="0.55"/>
        <text x="40" y="20" text-anchor="middle">Cases</text>
      </g>
      <g transform="translate(508 248)">
        <rect width="76" height="30" rx="15" fill="#34d399" fill-opacity="0.12" stroke="#34d399" stroke-opacity="0.55"/>
        <text x="38" y="20" text-anchor="middle">SOAR</text>
      </g>
      <g transform="translate(594 248)">
        <rect width="96" height="30" rx="15" fill="#22d3ee" fill-opacity="0.12" stroke="#22d3ee" stroke-opacity="0.55"/>
        <text x="48" y="20" text-anchor="middle" fill="#cffafe">AI triage</text>
      </g>
      <g transform="translate(700 248)">
        <rect width="140" height="30" rx="15" fill="#22d3ee" fill-opacity="0.12" stroke="#22d3ee" stroke-opacity="0.55"/>
        <text x="70" y="20" text-anchor="middle" fill="#cffafe">Detection-as-code</text>
      </g>
    </g>

    <rect x="0" y="316" width="1280" height="4" fill="url(#accent)"/>
  </g>
</svg>
