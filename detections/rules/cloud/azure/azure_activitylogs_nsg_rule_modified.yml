title: Azure Network Security Group Or Rule Modified
id: 665f480d-c67e-45c8-8874-c3b19826ca37
status: test
description: Detects successful creation, update or deletion of Azure Network Security Groups and their security rules, which can expose workloads or remove network restrictions.
references:
  - https://learn.microsoft.com/en-us/azure/role-based-access-control/permissions/networking
  - https://attack.mitre.org/techniques/T1686/001/
author: OpenSOC Detection Engineering
date: 2026-11-04
tags:
  - attack.defense-impairment
  - attack.t1686.001
logsource:
  product: azure
  service: activitylogs
detection:
  selection:
    operationName:
      - 'MICROSOFT.NETWORK/NETWORKSECURITYGROUPS/WRITE'
      - 'MICROSOFT.NETWORK/NETWORKSECURITYGROUPS/DELETE'
      - 'MICROSOFT.NETWORK/NETWORKSECURITYGROUPS/SECURITYRULES/WRITE'
      - 'MICROSOFT.NETWORK/NETWORKSECURITYGROUPS/SECURITYRULES/DELETE'
    status:
      - 'Success'
      - 'Succeeded'
  condition: selection
falsepositives:
  - Network changes deployed by approved pipelines or administrators
level: medium
