title: GCP Service Account Key Created
id: 6b9f652f-fe6a-44e7-902f-86ae15c0fab3
status: test
description: Detects creation of a user-managed service account key, a long-lived credential that attackers mint to keep access to a GCP project.
references:
  - https://cloud.google.com/iam/docs/keys-create-delete
  - https://attack.mitre.org/techniques/T1098/001/
author: OpenSOC Detection Engineering
date: 2026-11-04
tags:
  - attack.persistence
  - attack.privilege-escalation
  - attack.t1098.001
logsource:
  product: gcp
  service: gcp.audit
detection:
  selection:
    gcp.audit.method_name: 'google.iam.admin.v1.CreateServiceAccountKey'
  condition: selection
falsepositives:
  - Legacy integrations that still rely on exported keys instead of workload identity federation
level: medium
