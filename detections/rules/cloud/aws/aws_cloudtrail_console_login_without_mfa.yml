title: AWS Console Login Without MFA
id: 34158a37-a9eb-4194-9360-322d0cd7c6b9
status: test
description: Detects successful console logins of IAM users that did not use multi-factor authentication, the typical outcome of password spraying or phished credentials.
references:
  - https://docs.aws.amazon.com/awscloudtrail/latest/userguide/cloudtrail-event-reference-aws-console-sign-in-events.html
  - https://attack.mitre.org/techniques/T1078/004/
author: OpenSOC Detection Engineering
date: 2026-11-04
tags:
  - attack.initial-access
  - attack.persistence
  - attack.privilege-escalation
  - attack.t1078.004
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    eventName: 'ConsoleLogin'
    additionalEventData.MFAUsed: 'No'
    responseElements.ConsoleLogin: 'Success'
  filter_main_federated:
    userIdentity.type:
      - 'AssumedRole'
      - 'FederatedUser'
  condition: selection and not 1 of filter_main_*
falsepositives:
  - Service accounts that are exempt from MFA by policy (they should not use the console)
level: medium
