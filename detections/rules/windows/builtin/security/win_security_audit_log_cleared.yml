title: Security Audit Log Cleared
id: 0066d221-4527-47dc-acbb-549e685698d3
status: stable
description: Detects Event ID 1102 (the Security audit log was cleared), which removes evidence of authentication and privilege use.
references:
  - https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/auditing/event-1102
  - https://attack.mitre.org/techniques/T1685/005/
author: OpenSOC Detection Engineering
date: 2026-11-04
tags:
  - attack.defense-impairment
  - attack.t1685.005
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 1102
    Provider_Name: 'Microsoft-Windows-Eventlog'
  condition: selection
falsepositives:
  - Log rotation performed manually by administrators on systems without log forwarding
level: high
