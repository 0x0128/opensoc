title: Member Added To Highly Privileged Security Group
id: 64d1c60e-a2da-423b-a914-d91cbb1efeec
status: stable
description: Detects an account being added to built-in privileged groups (Administrators, Domain/Enterprise/Schema Admins, Backup/Account Operators, DnsAdmins) through Event IDs 4728, 4732 and 4756.
references:
  - https://attack.mitre.org/techniques/T1098/
  - https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/plan/security-best-practices/appendix-b--privileged-accounts-and-groups-in-active-directory
author: OpenSOC Detection Engineering
date: 2026-11-04
tags:
  - attack.persistence
  - attack.privilege-escalation
  - attack.t1098
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID:
      - 4728
      - 4732
      - 4756
    TargetUserName:
      - 'Administrators'
      - 'Domain Admins'
      - 'Enterprise Admins'
      - 'Schema Admins'
      - 'Backup Operators'
      - 'Account Operators'
      - 'DnsAdmins'
  condition: selection
falsepositives:
  - Approved privileged access changes (correlate with the change management ticket)
level: high
