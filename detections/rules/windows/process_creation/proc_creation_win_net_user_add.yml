title: Local Or Domain User Created With Net.exe
id: ae2311fc-3039-480d-bc4d-f7380f16d94e
status: test
description: Detects creation of a user account with "net user <name> <password> /add", frequently used by attackers to establish persistence.
references:
  - https://attack.mitre.org/techniques/T1136/001/
author: OpenSOC Detection Engineering
date: 2026-11-04
tags:
  - attack.persistence
  - attack.t1136.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
    - Image|endswith:
        - '\net.exe'
        - '\net1.exe'
    - OriginalFileName:
        - 'net.exe'
        - 'net1.exe'
  selection_user:
    CommandLine|contains: ' user '
  selection_add:
    CommandLine|contains|windash: ' -add'
  condition: all of selection_*
falsepositives:
  - Help desk or provisioning scripts creating local accounts
level: medium
