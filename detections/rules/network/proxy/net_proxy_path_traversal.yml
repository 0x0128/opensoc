title: Path Traversal Attempt In HTTP Request
id: e0372a3a-caae-40b6-bd81-5fecbe2c2f25
status: test
description: Detects directory traversal sequences (plain, URL-encoded and double-encoded) or direct references to sensitive OS files in HTTP request URIs.
references:
  - https://owasp.org/www-community/attacks/Path_Traversal
  - https://attack.mitre.org/techniques/T1190/
author: OpenSOC Detection Engineering
date: 2026-11-04
tags:
  - attack.initial-access
  - attack.t1190
logsource:
  category: proxy
detection:
  selection:
    c-uri|contains:
      - '../../'
      - '..%2f'
      - '%2e%2e/'
      - '%2e%2e%2f'
      - '..%5c'
      - '%252e%252e%252f'
      - '/etc/passwd'
      - '/etc/shadow'
      - 'win.ini'
  condition: selection
falsepositives:
  - Vulnerability scanners and broken clients generating relative URLs
level: medium
