rule_id: fc51e125-0d62-4211-a03d-962e0af0c474
cases:
  - name: Run key launching a payload from the Temp folder
    expect: match
    event:
      EventType: SetValue
      Image: 'C:\Users\jdoe\AppData\Local\Temp\dropper.exe'
      TargetObject: 'HKU\S-1-5-21-1111111111-2222222222-3333333333-1104\Software\Microsoft\Windows\CurrentVersion\Run\WindowsUpdater'
      Details: 'C:\Users\jdoe\AppData\Local\Temp\upd\winupd.exe'
      User: 'OPENSOC\jdoe'
  - name: Run key starting PowerShell
    expect: match
    event:
      EventType: SetValue
      Image: 'C:\Windows\System32\reg.exe'
      TargetObject: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Run\Health'
      Details: 'powershell.exe -w hidden -nop -c "iex(gc C:\ProgramData\h.txt)"'
      User: 'NT AUTHORITY\SYSTEM'
  - name: Vendor agent registered under Program Files
    expect: no_match
    event:
      EventType: SetValue
      Image: 'C:\Program Files\Contoso\setup.exe'
      TargetObject: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Run\ContosoTray'
      Details: '"C:\Program Files\Contoso\tray.exe" --minimized'
      User: 'NT AUTHORITY\SYSTEM'
