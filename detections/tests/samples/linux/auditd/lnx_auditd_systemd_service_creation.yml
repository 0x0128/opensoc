rule_id: b2267c57-f347-407f-b0cd-3f37f7d7aa56
cases:
  - name: Malicious service unit dropped by a shell
    expect: match
    event:
      type: PATH
      name: /etc/systemd/system/dbus-update.service
      comm: bash
      exe: /usr/bin/bash
      syscall: 257
      uid: 0
      key: systemd
  - name: User-level timer for persistence without root
    expect: match
    event:
      type: PATH
      name: /home/web/.config/systemd/user/cache-clean.timer
      comm: cp
      exe: /usr/bin/cp
      syscall: 257
      uid: 1002
      key: systemd
  - name: Package installing its unit file
    expect: no_match
    event:
      type: PATH
      name: /lib/systemd/system/nginx.service
      comm: dpkg
      exe: /usr/bin/dpkg
      syscall: 82
      uid: 0
      key: systemd
