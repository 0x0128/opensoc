rule_id: 7faa524a-f64a-4c05-9328-626f148198e6
cases:
  - name: Root user signs in to the console
    expect: match
    event:
      eventSource: signin.amazonaws.com
      eventName: ConsoleLogin
      eventTime: '2026-11-04T02:13:00Z'
      sourceIPAddress: 203.0.113.99
      userAgent: 'Mozilla/5.0 (Windows NT 10.0; Win64; x64)'
      userIdentity:
        type: Root
        arn: 'arn:aws:iam::111122223333:root'
        accountId: '111122223333'
      responseElements:
        ConsoleLogin: Success
      additionalEventData:
        MFAUsed: 'Yes'
        LoginTo: 'https://console.aws.amazon.com/console/home'
  - name: IAM user signs in to the console
    expect: no_match
    event:
      eventSource: signin.amazonaws.com
      eventName: ConsoleLogin
      eventTime: '2026-11-04T08:00:00Z'
      sourceIPAddress: 198.51.100.10
      userAgent: 'Mozilla/5.0 (Windows NT 10.0; Win64; x64)'
      userIdentity:
        type: IAMUser
        arn: 'arn:aws:iam::111122223333:user/ana'
        userName: ana
      responseElements:
        ConsoleLogin: Success
      additionalEventData:
        MFAUsed: 'Yes'
