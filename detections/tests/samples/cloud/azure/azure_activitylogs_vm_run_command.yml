      caller: ana@opensoc.example
      callerIpAddress: 198.51.100.10
      category: Administrative
      resourceId: /subscriptions/00000000-0000-0000-0000-000000000001/resourceGroups/identity-rg/providers/Microsoft.Compute/virtualMachines/dc01
