rule_id: 6b9f652f-fe6a-44e7-902f-86ae15c0fab3
cases:
  - name: Key created for the deployment service account
    expect: match
    event:
      gcp.audit.method_name: google.iam.admin.v1.CreateServiceAccountKey
      gcp.audit.service_name: iam.googleapis.com
      gcp.audit.principal_email: ana@opensoc.example
      gcp.audit.resource_name: projects/-/serviceAccounts/deployer@opensoc-prod.iam.gserviceaccount.com
  - name: Service account keys listed
    expect: no_match
    event:
      gcp.audit.method_name: google.iam.admin.v1.ListServiceAccountKeys
      gcp.audit.service_name: iam.googleapis.com
      gcp.audit.principal_email: secops@opensoc.example
      gcp.audit.resource_name: projects/-/serviceAccounts/deployer@opensoc-prod.iam.gserviceaccount.com
