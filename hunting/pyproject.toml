[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opensoc-hunting"
version = "0.1.0"
description = "Atomic Red Team emulation, threat hunting hypotheses and IOC management (STIX 2.1/CSV) against MISP for the OpenSOC lab."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "stix2>=3.0",
]

[project.scripts]
opensoc-emulate = "opensoc_hunting.emulation.cli:main"
opensoc-hunt = "opensoc_hunting.hunts:main"
opensoc-ioc = "opensoc_hunting.ioc.cli:main"

[tool.setuptools.packages.find]
include = ["opensoc_hunting*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 130
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
